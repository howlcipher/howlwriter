# HowlWriter Empirical Evaluation Benchmark Dataset
# 35 cases across 11 diverse categories

- id: academic_privacy_001
  mode: academic
  category: academic/research
  task: >
    Compare modern cybersecurity and privacy regulations (GDPR, CCPA/CPRA, and NIS2).
    Analyze their enforcement mechanisms, territorial scope, and statutory penalty structures.
  requirements:
    min_words: 350
    max_words: 650
    required_sections:
      - "Regulatory Scope and Jurisdiction"
      - "Enforcement and Penalty Structures"
      - "Comparative Analysis and Limitations"
    required_points:
      - "GDPR Article 83 penalties up to 20 million euros or 4% of global turnover"
      - "CCPA private right of action for data breaches"
      - "NIS2 management liability and critical infrastructure scope"
    citations: required
    min_sources: 3
    forbidden_words:
      - "delve"
      - "testament"
      - "tapestry"
      - "beacon"
  source_corpus:
    - title: "Regulation (EU) 2016/679 (General Data Protection Regulation)"
      authors: ["European Parliament", "Council of the European Union"]
      year: 2016
      url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
      publisher: "EUR-Lex"
      snippet: "Article 83 outlines administrative fines up to 20,000,000 EUR or 4% of total worldwide annual turnover."
    - title: "California Consumer Privacy Act of 2018 (CCPA)"
      authors: ["California State Legislature"]
      year: 2018
      url: "https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=CIV&division=3.&title=1.81.5."
      publisher: "California Legislative Information"
      snippet: "Grants consumer rights to know, delete, and opt-out, with statutory damages of $100 to $750 per consumer per incident."
    - title: "Directive (EU) 2022/2555 (NIS 2 Directive)"
      authors: ["European Union"]
      year: 2022
      url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
      publisher: "EUR-Lex"
      snippet: "Broadens cybersecurity requirements for essential and important entities across member states."
  metrics:
    - requirement_satisfaction
    - factuality
    - citation_integrity
    - source_quality
    - writing_quality_signals


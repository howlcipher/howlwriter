- id: voice_systems_debug_003
  mode: technical
  category: voice-preserving rewrite
  task: >
    Clean up this engineer's debugging notes into a cohesive technical log while maintaining
    the distinctive personal voice and conversational cadence.
  input_text: >
    Every Tuesday at 04:00 UTC, our TCP connections would randomly drop with ECONNRESET. Wireshark showed

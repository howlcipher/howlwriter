- id: edit_vendor_proposal_001
  mode: professional
  category: editing/rewrite
  task: >
    Edit and tighten this bloated vendor proposal excerpt. Eliminate corporate buzzwords, passive voice,
    and vague claims while preserving the core pricing, timeline, and SLA terms.
  input_text: >
    It is believed that our company will be leveraging synergistic paradigms in order to facilitate
    the seamless migration of your legacy architecture into our cloud environment. It should be noted
    that the estimated timeline will roughly be ninety days, and the cost structure is set at forty-five
    thousand dollars ($45,000) with a guaranteed uptime service level agreement of ninety-nine point nine
    percent (99.9%). Furthermore, our expert engineers will be utilizing cutting-edge methodologies.
  requirements:
    min_words: 40
    max_words: 90
    required_points:
      - "90 days timeline"
      - "$45,000 cost"
      - "99.9% uptime SLA"
    verbatim_phrases:
      - "$45,000"
      - "99.9%"
    forbidden_words:
      - "synergistic"
      - "cutting-edge"
  metrics:
    - requirement_satisfaction
    - meaning_preservation
    - writing_quality_signals


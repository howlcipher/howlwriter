title: "Site Reliability Engineering Error Budgets and Service Level Objectives"
type: academic
topic: >
  Investigate how service level objectives and error budgets align engineering
  incentives with user experience, including how organizations trade off
  reliability against feature velocity and when error budgets trigger launch freezes.
target_words: 1500
word_tolerance_percent: 10
citation_style: apa7
source_requirements:
  minimum_sources: 6
  prefer_primary_sources: true
  scholarly_or_authoritative: true
requirements:
  - Support factual claims with citations
  - Do not fabricate sources
  - Include an APA 7 reference page
  - Discuss both SLO design and organizational trade-offs
outline:
  - Introduction
  - Defining SLOs and SLIs
  - Error budget rationale
  - Policy enforcement
  - Cultural and technical trade-offs
  - Conclusion

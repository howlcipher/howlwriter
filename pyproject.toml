[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "howlwriter"
dynamic = ["version"]
description = "A writing, editing, humanization, research, citation, provenance, and verification system built to work with HowlPlane."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML>=6.0",
    # Bounded remote provider transport for the native Writer path. Pinned to
    # the same commit as howlcreate and howldream: pip treats different direct
    # URLs for one project as a conflict, so the three must stay identical.
    "howl-provider-core @ git+https://github.com/howlcipher/howl-provider-core.git@d5ae6d696d95bebd799e9ae51fc18b7622e2c985",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    # Starlette TestClient prefers httpx2; keep httpx for runtime callers.
    "httpx2>=2.0.0",
    "playwright>=1.55,<2.0",
    # Pure-Python packet parsing, so packet-capture tests run without TShark.
    "dpkt>=1.9,<2.0",
    "howlwriter[web,corpus,publish]",
]
sources = [
    # Source Intelligence adapters (`howlwriter project`). Everything runs
    # locally; models are downloaded once and no source content is uploaded.
    # Each is optional: without it, that format is inventoried and reported
    # as not read, never guessed at.
    "howlwriter[corpus]",
    "dpkt>=1.9,<2.0",                    # packet captures when TShark is absent
    "rapidocr-onnxruntime>=1.4,<2.0",    # OCR for screenshots, image-only PDF pages, video frames
    "pillow>=10.0",                      # image downscaling before OCR
    "imageio-ffmpeg>=0.5,<1.0",          # a bundled ffmpeg for audio and frame extraction
    "av>=12.0",                          # media probing
    "faster-whisper>=1.0,<2.0",          # local speech transcription
    "playwright>=1.55,<2.0",             # optional browser research and lab observation
]
corpus = [
    # PDF text extraction for `howlwriter voice build`. Optional on purpose:
    # DOCX, ODT, RTF, HTML, TXT and MD are parsed with the standard library,
    # so the core install stays dependency-light and only PDFs degrade to a
    # reported "extraction unavailable" when this extra is not installed.
    "pypdf>=4.0,<8.0",
]
docx = [
    "python-docx>=1.0.0",
]
pdf = [
    "playwright>=1.40,<2.0",
]
gdocs = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
]
publish = [
    "howlwriter[docx,pdf,gdocs]",
]
plane = [
    # HowlPlane runs every model step in-process (role dispatch and the
    # claude/agy/codex/local backends). `howl install` supplies it; this
    # extra is for a plain pip install. Without it a chosen model reports
    # that HowlPlane is unavailable instead of running.
    "howlplane @ git+https://github.com/howlcipher/howlplane.git@f3f9c0f057a523c7f64f9932a73e0f46471bd91e",
]
web = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "httpx>=0.27,<1.0",
]
ui = [
    "howlwriter[web]",
]

[project.scripts]
howlwriter = "howlwriter.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "howlwriter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The frontend build output (committed under src/howlwriter/web/static/)
# is required at runtime for `howlwriter ui` -- without this, setuptools
# silently excludes it from the built wheel and the UI serves nothing.
"howlwriter.web" = ["static/**/*"]
"howlwriter.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "contract: validates the integration against the REAL pinned HowlPlane package; skipped when the hermetic test double is active, run by the dedicated contract CI job",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "howlwriter"
version = "0.1.0"
description = "A writing, editing, humanization, research, citation, provenance, and verification system built to work with HowlPlane."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
]
corpus = [
    # PDF text extraction for `howlwriter voice build`. Optional on purpose:
    # DOCX, ODT, RTF, HTML, TXT and MD are parsed with the standard library,
    # so the core install stays dependency-light and only PDFs degrade to a
    # reported "extraction unavailable" when this extra is not installed.
    "pypdf>=4.0,<8.0",
]
web = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "httpx>=0.27,<1.0",
]
ui = [
    "howlwriter[web]",
]

[project.scripts]
howlwriter = "howlwriter.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

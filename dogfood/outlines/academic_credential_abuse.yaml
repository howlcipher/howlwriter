# A realistic academic outline exercising every part of the academic path:
# thesis, required sections, claims tied to sources, evidence requirements,
# preserved sentences, research-needed nodes, APA 7, a target range and a hard
# maximum. Written to be answerable from public scholarly sources.
schema: outline/v1
title: Detecting Credential Abuse When the Credentials Are Valid
topic: >-
  Why authentication-based detection fails against adversaries using legitimate
  credentials, and what behavioural approaches can and cannot recover
mode: academic
# Sized to complete inside the provider CLI's own 5-minute print timeout.
# A 1600-word target timed out at the agy layer: HowlPlane passes a
# subprocess timeout but never forwards --print-timeout, so agy's default
# fires first and returns a timeout string as output. That is a sibling-repo
# gap, recorded rather than worked around inside HowlWriter.
target_words: 900
max_words: 1100
enforce_order: true
voice_profile: william_v2

nodes:
  - kind: heading
    text: Introduction

  - kind: thesis
    id: claim_thesis
    text: >-
      Credential-based intrusions defeat authentication-centred detection because
      the adversary's access is, by every check the system performs, legitimate.

  - kind: preserve
    text: Detection is not a solved problem, and treating it as one is itself a risk.

  - kind: heading
    text: Why authentication signals fail

  - kind: claim
    id: claim_auth
    text: >-
      Authentication events cannot distinguish an authorised user from an
      adversary holding that user's credentials.
    sources: [source_01]

  - kind: expand
    text: >-
      Develop the consequence for detection engineering: controls that gate on
      identity have already passed by the time the behaviour becomes suspicious.

  - kind: heading
    text: Behavioural baselines and their limits

  - kind: claim
    id: claim_baseline
    text: >-
      Behavioural baselining shifts detection from identity to activity, but its
      false-positive burden rises with legitimate variance in user behaviour.

  - kind: required_point
    text: alert fatigue as a consequence of high false-positive rates

  - kind: heading
    text: Implications for practice

  - kind: required_point
    text: detection strategies that assume compromise rather than prevent it

  - kind: ending
    text: >-
      Close on the trade-off between detection sensitivity and operational
      sustainability. No motivational ending, no call to action.

  - kind: style_note
    text: APA 7 in-text citations throughout. Formal academic register.

research:
  - question: >-
      Find peer-reviewed or authoritative evidence on the difficulty of detecting
      attacks that use valid stolen credentials.
    required: true
    supports_claims: [claim_auth]
  - question: >-
      Find evidence on false-positive rates and alert fatigue in behavioural
      anomaly detection for insider or credential-based threats.
    required: true
    supports_claims: [claim_baseline]

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and verify wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CI builds the frontend itself rather than trusting the committed
      # static/ output to be fresh -- that output is only a fallback for
      # source-checkout development, not the release input.
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS

      # Proves the wheel is a working "howlwriter" console script from a
      # clean, isolated, core-only install -- not merely that the archive
      # was created. This is exactly the defect fixed alongside this
      # workflow: `ui`'s fastapi import used to be eager, so --version and
      # every other subcommand broke without the optional "web" extra.
      - name: Install wheel (core only) and verify
        run: |
          python -m venv /tmp/verify-venv-core
          /tmp/verify-venv-core/bin/python -m pip install --quiet dist/*.whl
          /tmp/verify-venv-core/bin/howlwriter --version
          /tmp/verify-venv-core/bin/howlwriter ui --no-browser; test $? -eq 1

      # Separately, with the "web" extra: proves the committed frontend
      # build output actually made it into the wheel (setuptools silently
      # drops package data that isn't explicitly declared) rather than
      # only proving the archive contains *a* static/ directory.
      - name: Install wheel (web extra) and verify static assets
        run: |
          python -m venv /tmp/verify-venv-web
          /tmp/verify-venv-web/bin/python -m pip install --quiet "$(ls dist/*.whl)[web]"
          /tmp/verify-venv-web/bin/python -c "
          import howlwriter.web.app as app_module
          from pathlib import Path
          static = Path(app_module.__file__).parent / 'static' / 'index.html'
          assert static.is_file(), f'{static} missing from installed wheel'
          "

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: howlwriter-wheel
          path: |
            dist/*.whl
            dist/SHA256SUMS

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: howlwriter-wheel
          path: dist

      - name: Check release notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          NOTES_FILE="docs/releases/${VERSION}.md"

          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Release notes not found at $NOTES_FILE. Aborting release."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          NOTES_FILE="docs/releases/${VERSION}.md"

          gh release create "$VERSION" \
            dist/*.whl dist/SHA256SUMS \
            --title "HowlWriter $VERSION" \
            --notes-file "$NOTES_FILE"

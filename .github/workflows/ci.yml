name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core Tests & Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify package CLI entrypoint
        run: howlwriter --help

      - name: Compile verification
        run: python -m compileall src/ tests/

      - name: Static correctness checks (F821, F401)
        run: flake8 src/ --select=F821,F401

      - name: Run core test suite
        run: pytest -q --ignore=tests/docs

      - name: Verify SEO Metadata & Artifacts
        run: python3 scripts/test_seo.py

  responsive:
    name: Responsive Browser QA (Playwright Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright Chromium with system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run responsive browser suite
        run: pytest tests/docs/ -v

  howlplane-contract:
    name: HowlPlane Integration Contract (Pinned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HowlWriter
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Checkout Pinned HowlPlane
        uses: actions/checkout@v4
        with:
          repository: howlcipher/howlplane
          path: deps/howlplane
          ref: main

      - name: Install dependencies with pinned HowlPlane
        run: |
          python -m pip install --upgrade pip
          pip install -e "deps/howlplane"
          pip install -e ".[dev]"

      - name: Run HowlPlane contract test without fakes
        env:
          HOWLWRITER_NO_CONTROL_PLANE_FAKES: "1"
        run: pytest tests/integration/test_howlplane_contract.py -v

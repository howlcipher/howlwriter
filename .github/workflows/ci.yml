name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  # "ci-" keeps this group distinct when release.yml calls this workflow:
  # github.workflow is then the caller's name, and sharing the caller's group
  # is a deadlock that cancels the release before any test runs.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core Tests & Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify package CLI entrypoint
        run: howlwriter --help

      - name: Compile verification
        run: python -m compileall src/ tests/

      - name: Static correctness checks (F821, F401)
        run: flake8 src/ --select=F821,F401

      - name: Run core test suite
        run: pytest -q -m "not contract" --ignore=tests/docs

      - name: Verify SEO Metadata & Artifacts
        run: python3 scripts/test_seo.py

      - name: Release notes exist for this version
        run: |
          version=$(sed -n 's/^__version__ *= *["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' src/howlwriter/__init__.py)
          if [ -z "$version" ]; then
            echo "::error::Could not read __version__ from src/howlwriter/__init__.py."
            exit 1
          fi
          notes="docs/releases/v${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing. Add release notes before bumping __version__ to ${version}."
            exit 1
          fi

  frontend:
    name: Frontend reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (locked) and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Committed bundle must match a fresh build
        run: |
          git status --porcelain src/howlwriter/web/static
          if [ -n "$(git status --porcelain src/howlwriter/web/static)" ]; then
            echo "::error::Committed SPA bundle is stale. Run 'npm ci && npm run build' in frontend/ and commit src/howlwriter/web/static."
            git diff --stat -- src/howlwriter/web/static
            exit 1
          fi

  responsive:
    name: Responsive Browser QA (Playwright Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright Chromium with system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run responsive browser suite
        run: pytest tests/docs/ -v

  howlplane-contract:
    name: HowlPlane Integration Contract (Pinned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HowlWriter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Checkout Pinned HowlPlane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: howlcipher/howlplane
          path: deps/howlplane
          ref: 4ba3e71a777747445173b381ca6db0a3d5366fe2

      - name: Install dependencies with pinned HowlPlane
        run: |
          python -m pip install --upgrade pip
          pip install -e "deps/howlplane"
          pip install -e ".[dev]"

      - name: Run HowlPlane contract test without fakes
        env:
          HOWLWRITER_NO_CONTROL_PLANE_FAKES: "1"
        run: pytest -m contract tests/integration/test_howlplane_contract.py -v
